name: Deploy GitHub Pages

# Pubblica web/ (la sola app per iPhone, in modalità demo) su GitHub Pages.
# setup.html e panel.html non vengono inclusi: hanno senso solo serviti dal Mac.

on:
  push:
    branches:
      - main
      - claude/iphone-mac-remote-control-orilyq
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepara il sito (senza setup.html e panel.html)
        run: |
          mkdir -p _site
          cp -r web/. _site/
          rm -f _site/setup.html _site/panel.html

      - name: Configura GitHub Pages
        uses: actions/configure-pages@v5

      - name: Carica l'artefatto
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Pubblica su GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
