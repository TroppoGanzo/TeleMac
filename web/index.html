<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, user-scalable=no">
<title>TeleMac</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="TeleMac">
<meta name="theme-color" content="#1e2a38">
<link rel="apple-touch-icon" href="/icon.png?size=180">
<link rel="icon" href="/icon.png?size=64">
<link rel="manifest" href="/manifest.json">
<link rel="stylesheet" href="/style.css">
</head>
<body>

<div id="status" class="status">Collegamento...</div>

<main id="panel-puntatore" class="panel active">
  <div class="pointer-stage">
    <button id="gyro-toggle" class="gyro-toggle">Attiva puntatore</button>
    <p class="hint">Tieni il telefono come un telecomando e inclinalo per muovere il cursore.</p>

    <div class="pointer-pad" hidden>
      <div class="dpad">
        <button data-key="up" class="dpad-btn dpad-up" aria-label="Su">▲</button>
        <button data-key="left" class="dpad-btn dpad-left" aria-label="Sinistra">◀</button>
        <button id="ok-btn" class="dpad-btn dpad-ok" aria-label="OK">OK</button>
        <button data-key="right" class="dpad-btn dpad-right" aria-label="Destra">▶</button>
        <button data-key="down" class="dpad-btn dpad-down" aria-label="Giù">▼</button>
      </div>
      <div class="pointer-row">
        <button id="right-click-btn" class="pill-btn">Clic destro</button>
        <button data-key="escape" class="pill-btn">Indietro</button>
      </div>
      <div class="pointer-row">
        <button data-media="prev" class="icon-btn">⏮</button>
        <button id="play-btn" class="icon-btn">⏯</button>
        <button data-media="next" class="icon-btn">⏭</button>
      </div>
      <div class="pointer-row">
        <button data-media="voldown" class="icon-btn">🔉</button>
        <button data-media="mute" class="icon-btn">🔇</button>
        <button data-media="volup" class="icon-btn">🔊</button>
        <button data-key="f" class="icon-btn">⛶</button>
      </div>
    </div>
  </div>
</main>

<main id="panel-tastiera" class="panel">
  <div class="keyboard-stage">
    <p class="hint">Scrivi qui: il testo arriva sul Mac dove hai il cursore.</p>
    <input id="text-input" type="text" autocapitalize="sentences" autocomplete="off" autocorrect="on" placeholder="Scrivi qualcosa...">
    <div class="pointer-row">
      <button data-key="return" class="pill-btn">Invio</button>
      <button data-key="backspace" class="pill-btn">Cancella</button>
      <button data-key="tab" class="pill-btn">Tab</button>
      <button data-key="escape" class="pill-btn">Esc</button>
    </div>
    <div class="pointer-row">
      <button id="spotlight-btn" class="pill-btn">🔍 Spotlight</button>
      <button id="urlbar-btn" class="pill-btn">🔗 Indirizzo</button>
    </div>
  </div>
</main>

<main id="panel-altro" class="panel">
  <div class="other-stage">
    <div class="group">
      <h2>Finestre e app</h2>
      <div class="pointer-row">
        <button id="switch-app-btn" class="pill-btn">⌘⇥ Cambia app</button>
        <button id="mission-control-btn" class="pill-btn">Mission Control</button>
      </div>
    </div>
    <div class="group">
      <h2>Browser</h2>
      <div class="pointer-row">
        <button id="back-btn" class="pill-btn">◀ Indietro</button>
        <button id="fwd-btn" class="pill-btn">Avanti ▶</button>
        <button id="reload-btn" class="pill-btn">⟲ Ricarica</button>
      </div>
      <div class="pointer-row">
        <button id="newtab-btn" class="pill-btn">＋ Nuova scheda</button>
        <button id="closetab-btn" class="pill-btn">✕ Chiudi scheda</button>
      </div>
    </div>
    <div class="group">
      <h2>Sistema</h2>
      <div class="pointer-row">
        <button id="sleep-btn" class="pill-btn danger">Spegni schermo</button>
      </div>
    </div>
    <div class="group">
      <h2>Impostazioni puntatore</h2>
      <label class="setting-row">
        Sensibilità
        <input id="sensitivity" type="range" min="20" max="200" value="80">
      </label>
      <label class="setting-row">
        <input id="invert-x" type="checkbox"> Inverti orizzontale
      </label>
      <label class="setting-row">
        <input id="invert-y" type="checkbox"> Inverti verticale
      </label>
      <label class="setting-row">
        <input id="swap-axes" type="checkbox"> Scambia assi
      </label>
      <p class="hint">Se il cursore va nella direzione sbagliata, prova questi interruttori.</p>
    </div>
  </div>
</main>

<nav class="tabbar">
  <button data-panel="puntatore" class="tab active">🎯<span>Puntatore</span></button>
  <button data-panel="tastiera" class="tab">⌨️<span>Tastiera</span></button>
  <button data-panel="altro" class="tab">⚙️<span>Altro</span></button>
</nav>

<script src="/app.js"></script>
</body>
</html>
